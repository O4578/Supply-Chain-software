    function updateSearchResults() {
      const input=document.getElementById('company-search');
      const panel=document.getElementById('search-results');
      const query=input.value.trim().toLowerCase();
      state.searchMatches=query?COMPANIES.filter(company=>`${company.name} ${company.ticker} ${company.hq} ${company.country} ${company.industry}`.toLowerCase().includes(query)).slice(0,10):[];
      state.searchIndex=state.searchMatches.length?Math.min(Math.max(state.searchIndex,0),state.searchMatches.length-1):-1;
      if (!query) { closeSearch(); return; }
      panel.innerHTML=state.searchMatches.length?state.searchMatches.map((company,index)=>
        `<button type="button" role="option" aria-selected="${index===state.searchIndex}" class="search-result ${index===state.searchIndex?'active':''}" data-search-index="${index}"><span><strong>${escapeHtml(company.name)}</strong><small>${escapeHtml(company.ticker)}</small></span><small>${escapeHtml(company.hq)} · ${escapeHtml(company.industry)}</small></button>`
      ).join(''):`<div class="empty">No match in the curated seed dataset.</div>`;
      panel.classList.add('open'); input.setAttribute('aria-expanded','true');
    }
    function closeSearch() {
      const panel=document.getElementById('search-results');
      panel.classList.remove('open'); panel.innerHTML='';
      document.getElementById('company-search').setAttribute('aria-expanded','false');
      state.searchMatches=[]; state.searchIndex=-1;
    }
    function selectSearchResult(index) {
      const company=state.searchMatches[index];
      if (company) openCompany(company.id);
    }
    function filterSupplyTable(query) {
      state.tableFilter=query;
      const direction=state.view==='suppliers'?'upstream':'downstream';
      const rows=walkSupplyChain(state.selectedCompany,direction,state.depth).filter(row=>{
        const company=companyById[row.otherId];
        return `${company.name} ${company.ticker} ${company.hq} ${row.rel.product} ${row.path.map(id=>companyById[id].name).join(' ')}`.toLowerCase().includes(query.toLowerCase());
      });
      const body=document.getElementById('supply-table-body');
      if (!body) return;
      if (!rows.length) { body.innerHTML=`<tr><td colspan="7"><div class="empty"><strong>No matching records</strong>Try another filter. The underlying dataset remains unchanged.</div></td></tr>`; return; }
      body.innerHTML=rows.map(row=>{
        const related=companyById[row.otherId], upstream=direction==='upstream';
        const path=row.path.map(id=>companyById[id].name).join(upstream?' ← ':' → ');
        return `<tr><td>${companyLink(related.id)}<div class="muted">${escapeHtml(related.ticker)}</div></td><td>${escapeHtml(related.hq)}</td><td>${escapeHtml(row.rel.product)}</td><td>${escapeHtml(path)}</td><td>${row.depth===1?'<span class="tag direct">Direct</span>':`<span class="tag indirect">Tier ${row.depth}</span>`}</td><td>${evidenceCell(row.rel)}</td><td>${assessmentTag(row.rel.assessment)}</td></tr>`;
      }).join('');
    }

    document.addEventListener('click', event => {
      const openButton=event.target.closest('[data-open-company]');
      if (openButton) { openCompany(openButton.dataset.openCompany); return; }
      const navButton=event.target.closest('[data-view]');
      if (navButton) { state.view=navButton.dataset.view; state.tableFilter=''; closeSearch(); render(); return; }
      const watchButton=event.target.closest('[data-toggle-watch]');
      if (watchButton) { toggleWatchlist(watchButton.dataset.toggleWatch); return; }
      const mapEntity=event.target.closest('[data-map-entity]');
      if (mapEntity) { state.mapSelected=mapEntity.dataset.mapEntity; render(); return; }
      const mapZoom=event.target.closest('[data-map-zoom]');
      if (mapZoom) {
        state.mapZoom=mapZoom.dataset.mapZoom==='in'?Math.min(2.25,state.mapZoom+0.25):mapZoom.dataset.mapZoom==='out'?Math.max(1,state.mapZoom-0.25):1;
        render(); return;
      }
      if (event.target.closest('[data-clear-map-selection]')) { state.mapSelected=''; render(); return; }
      const searchButton=event.target.closest('[data-search-index]');
      if (searchButton) { selectSearchResult(Number(searchButton.dataset.searchIndex)); return; }
      if (!event.target.closest('.search-wrap')) closeSearch();
      const graphNode=event.target.closest('[data-node-id]');
      if (graphNode) openCompany(graphNode.dataset.nodeId);
    });
    document.addEventListener('keydown', event => {
      const graphNode=event.target.closest?.('[data-node-id]');
      if (graphNode && (event.key==='Enter'||event.key===' ')) { event.preventDefault(); openCompany(graphNode.dataset.nodeId); }
      const mapMarker=event.target.closest?.('[data-map-entity]');
      if (mapMarker && (event.key==='Enter'||event.key===' ')) { event.preventDefault(); state.mapSelected=mapMarker.dataset.mapEntity; render(); }
    });
    document.getElementById('company-search').addEventListener('input', event => { state.searchIndex=0; updateSearchResults(); });
    document.getElementById('company-search').addEventListener('keydown', event => {
      if (event.key==='ArrowDown' && state.searchMatches.length) { event.preventDefault(); state.searchIndex=Math.min(state.searchIndex+1,state.searchMatches.length-1); updateSearchResults(); }
      else if (event.key==='ArrowUp' && state.searchMatches.length) { event.preventDefault(); state.searchIndex=Math.max(state.searchIndex-1,0); updateSearchResults(); }
      else if (event.key==='Enter' && state.searchMatches.length) { event.preventDefault(); selectSearchResult(state.searchIndex<0?0:state.searchIndex); }
      else if (event.key==='Escape') closeSearch();
    });
    document.addEventListener('change', event => {
      const target=event.target;
      if (target.matches('[data-graph-filter]')) { state.filters[target.dataset.graphFilter]=target.checked; render(); }
      if (target.id==='graph-depth') { state.depth=Number(target.value); render(); }
      if (target.id==='supply-depth') { state.depth=Number(target.value); state.tableFilter=''; render(); }
      if (target.id==='map-country') { state.mapCountry=target.value; render(); }
      if (target.id==='map-industry') { state.mapIndustry=target.value; render(); }
      if (target.id==='map-facility-type') { state.mapFacilityType=target.value; render(); }
      if (target.id==='map-show-hq') { state.mapShowHQ=target.checked; render(); }
      if (target.id==='map-show-facilities') { state.mapShowFacilities=target.checked; render(); }
      if (target.id==='map-show-links') { state.mapShowLinks=target.checked; render(); }
    });
    document.addEventListener('input', event => {
      const target=event.target;
      if (target.id==='graph-filter') { state.graphFilter=target.value; applyGraphSearch(); }
      if (target.id==='relationship-filter') filterSupplyTable(target.value);
      if (target.id==='map-search') {
        state.mapSearch=target.value;
        const cursor=target.selectionStart;
        render();
        const refreshed=document.getElementById('map-search');
        if (refreshed) { refreshed.focus(); try { refreshed.setSelectionRange(cursor,cursor); } catch {} }
      }
    });

    // =====================================================================
    // AI Research Assistant
    // Natural-language company research backed by a local backend that
    // combines the dataset graph, live web/EDGAR evidence and a configurable
    // AI provider. All API keys stay in the backend (.env), never here.
    // =====================================================================

    const AI_MODES = [
      ['auto','Auto (detect from question)'],
      ['supply-chain','Supply Chain Research'],
      ['company','Company Research'],
      ['investment','Investment Opportunity Finder'],
      ['risk','Supply Chain Risk Analysis'],
      ['competitor','Competitor Analysis'],
      ['industry','Industry Research']
    ];
    const AI_SUGGESTIONS = [
      'Who supplies NVIDIA\'s HBM memory?',
      'Who are ASML\'s largest publicly known customers?',
      'Which European companies benefit from increased Airbus production?',
      'Which publicly traded companies supply Rheinmetall?',
      'Who supplies TSMC with semiconductor manufacturing equipment?',
      'Which companies could benefit if NVIDIA doubles its GPU production?',
      'What would happen to NVIDIA\'s supply chain if TSMC experienced a major production disruption?',
      'Which companies depend heavily on a single customer?',
      'Identify publicly traded European companies that are suppliers to the defence industry.'
    ];
    const AI_STAGES = [
      ['understand','Understanding question'],
      ['identify','Identifying companies'],
      ['search','Searching public sources'],
      ['verify','Verifying relationships'],
      ['analyze','Analyzing findings'],
      ['report','Preparing research report']
    ];
    const AI_BACKEND_UNREACHABLE = 'The AI research backend is not reachable. Start it with \\"node backend/server.js\\" from the project folder (see the README setup guide), then open http://localhost:3000.';

    const AI = {
      sessions: loadResearchSessions(),
      activeId: null,
      mode: 'auto',
      draft: '',
      loading: null,
      stageTimer: null,
      backend: null,
      backendChecked: false,
      modalOpen: false,
      modalCompanies: [],
      modalReportTitle: ''
    };
    if (AI.sessions.length) AI.activeId = AI.sessions[0].id;

    function loadResearchSessions() {
      try {
        const raw = localStorage.getItem('sci_research_sessions');
        const value = raw ? JSON.parse(raw) : [];
        return Array.isArray(value) ? value : [];
      } catch { return []; }
    }
    function saveResearchSessions() {
      try { localStorage.setItem('sci_research_sessions', JSON.stringify(AI.sessions.slice(0, 50))); } catch {}
    }
    function aiActiveSession() {
      return AI.sessions.find(session => session.id === AI.activeId) || null;
    }
    function aiNewSession() {
      const session = { id:`ai-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, title:'New research', created:Date.now(), saved:false, messages:[] };
      AI.sessions.unshift(session);
      AI.activeId = session.id;
      return session;
    }
    function lastAssistantReport(session) {
      if (!session) return null;
      for (let index = session.messages.length - 1; index >= 0; index--) {
        const message = session.messages[index];
        if (message.role === 'assistant' && message.report) return message;
      }
      return null;
    }

    function aiNormalizeName(value) {
      return String(value || '').toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
    }
    function aiResolveDbId(name) {
      const target = aiNormalizeName(name);
      if (!target) return null;
      for (const company of COMPANIES) {
        if (aiNormalizeName(company.name) === target) return company.id;
        if (aiNormalizeName((company.ticker || '').split('·')[0]) === target) return company.id;
      }
      for (const company of COMPANIES) {
        const normalized = aiNormalizeName(company.name);
        if (normalized.length >= 4 && (target.includes(normalized) || normalized.includes(target))) return company.id;
      }
      return null;
    }
    function aiCompanyExists(name) {
      return !!aiResolveDbId(name);
    }
    function dbSnapshot() {
      return {
        companies: COMPANIES.map(company => ({ id:company.id, name:company.name, ticker:company.ticker, country:company.country, industry:company.industry, description:company.description })),
        relationships: RELATIONSHIPS.map(rel => ({ id:rel.id, type:rel.type, supplierId:rel.supplierId, customerId:rel.customerId, companyA:rel.companyA, companyB:rel.companyB, product:rel.product, assessment:rel.assessment, evidenceStatus:rel.evidenceStatus, evidenceNote:rel.evidenceNote })),
        sources: SOURCES
      };
    }

    async function aiCheckBackend() {
      AI.backendChecked = true;
      try {
        const response = await fetch('/api/health', { signal: AbortSignal.timeout(3000) });
        AI.backend = response.ok ? await response.json() : null;
      } catch { AI.backend = null; }
      if (state.view === 'ai') render();
    }

    function aiFocusQuestion() {
      const input = document.getElementById('ai-question');
      if (!input) return;
      input.value = AI.draft;
      if (AI.focusInput) { input.focus(); AI.focusInput = false; }
    }

    function aiStartStageTicker() {
      if (AI.stageTimer) clearInterval(AI.stageTimer);
      AI.stageTimer = setInterval(() => {
        if (!AI.loading) { clearInterval(AI.stageTimer); AI.stageTimer = null; return; }
        AI.loading.stageTick = Math.min((AI.loading.stageTick || 0) + 1, AI_STAGES.length - 2);
        render();
      }, 3200);
    }

    async function aiAsk(question) {
      const session = aiActiveSession() || aiNewSession();
      session.messages.push({ role:'user', text:question, time:Date.now() });
      if (session.messages.length === 1) session.title = question.slice(0, 70);
      AI.draft = ''; AI.focusInput = false;
      AI.loading = { sessionId:session.id, stageTick:0 };
      saveResearchSessions();
      aiStartStageTicker();
      render();
      try {
        const response = await fetch('/api/research', {
          method:'POST',
          headers:{ 'content-type':'application/json' },
          body: JSON.stringify({ question, mode:AI.mode, db:dbSnapshot() })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `Backend error ${response.status}`);
        session.messages.push({ role:'assistant', report:data.report, meta:data.meta || {}, time:Date.now() });
      } catch (error) {
        session.messages.push({
          role:'assistant', error:error.message,
          hint:error.message && error.message.includes('Failed to fetch') ? AI_BACKEND_UNREACHABLE : null,
          time:Date.now()
        });
      }
      AI.loading = null;
      if (AI.stageTimer) { clearInterval(AI.stageTimer); AI.stageTimer = null; }
      saveResearchSessions();
      render();
    }

    function aiEvidenceTag(evidence) {
      const labels = { confirmed:'Confirmed', reported:'Reported', inferred:'Inferred', unknown:'Unverified' };
      return `<span class="tag ev-${escapeHtml(evidence)}">${escapeHtml(labels[evidence] || 'Unverified')}</span>`;
    }
    function aiConfidenceTag(confidence) {
      return `<span class="muted" style="font-size:11px"><i class="ai-conf ${escapeHtml(confidence)}"></i>${escapeHtml(confidence)} confidence</span>`;
    }
    function aiSourceInline(report, sourceIds) {
      if (!Array.isArray(sourceIds) || !sourceIds.length) return '';
      const links = sourceIds.map(id => {
        const source = (report.sources || []).find(item => item.id === id);
        if (!source) return '';
        const href = safeUrl(source.url);
        const label = source.publisher || source.title || 'source';
        return href !== '#' ? `<a class="tag source-checked" href="${href}" target="_blank" rel="noopener noreferrer" title="${escapeHtml(source.title || '')}\n${escapeHtml(source.verifies || '')}">[citation: ${escapeHtml(label)}]</a>` : `<span class="tag source-checked" title="${escapeHtml(source.verifies || '')}">[citation: ${escapeHtml(label)}]</span>`;
      }).filter(Boolean);
      return links.length ? `<div class="ai-card-meta" style="margin-top:7px;display:flex;flex-wrap:wrap;gap:5px">${links.join(' ')}</div>` : '';
    }

    function aiCompanyCard(report, company) {
      const initials = company.name.split(/\s+/).slice(0, 2).map(word => word[0]).join('').toUpperCase();
      const metaParts = [company.ticker, company.exchange, company.country, company.industry].filter(Boolean).map(part => escapeHtml(part));
      const directness = company.directness === 'direct'
        ? '<span class="tag direct">Direct</span>'
        : company.directness === 'indirect' ? '<span class="tag indirect">Indirect</span>' : '<span class="tag">Relationship tier unknown</span>';
      const inDb = company.dbId && companyById[company.dbId];
      const nameHtml = inDb
        ? `<button type="button" class="company-link large" data-open-company="${escapeHtml(company.dbId)}">${escapeHtml(company.name)}</button>`
        : `<strong style="font-size:15px">${escapeHtml(company.name)}</strong> <span class="tag">Not in database</span>`;
      return `<div class="ai-company-card">
        <div class="ai-card-top">
          <div><span class="ai-card-logo">${escapeHtml(initials)}</span>${nameHtml}
            <div class="ai-card-meta" style="margin-top:4px">${metaParts.join(' · ')}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
            ${directness}${aiEvidenceTag(company.evidence)}${aiConfidenceTag(company.confidence)}
          </div>
        </div>
        ${company.relationship ? `<p style="margin:8px 0 0"><strong>${escapeHtml(company.role === 'candidate-beneficiary' ? 'Potential beneficiary' : company.role || 'Related company')}</strong> — ${escapeHtml(company.relationship)}</p>` : ''}
        ${company.products ? `<p class="muted" style="margin:5px 0 0">Products / services: ${escapeHtml(company.products)}</p>` : ''}
        ${company.explanation ? `<p style="margin:6px 0 0">${escapeHtml(company.explanation)}</p>` : ''}
        ${company.investmentNote ? `<p class="notice info" style="margin:8px 0 0;padding:8px 10px">${escapeHtml(company.investmentNote)}</p>` : ''}
        ${aiSourceInline(report, company.sourceIds)}
      </div>`;
    }

    function aiRelationshipDiagram(report) {
      const rels = (report.relationships || []).filter(rel => rel.from && rel.to);
      if (!rels.length) return '';
      const subjectName = report.subject?.name || null;
      const nodeIds = new Map();
      const nodeOf = name => {
        if (!nodeIds.has(name)) nodeIds.set(name, { name, suppliers:[], customers:[], others:[] });
        return nodeIds.get(name);
      };
      for (const rel of rels) {
        if (subjectName && rel.type === 'supply') {
          if (rel.to === subjectName) nodeOf(rel.from).suppliers.push(rel);
          else if (rel.from === subjectName) nodeOf(rel.to).customers.push(rel);
          else nodeOf(rel.from).others.push(rel);
        } else {
          nodeOf(rel.from).others.push(rel);
        }
      }
      const subject = subjectName ? nodeOf(subjectName) : null;
      const nodeBox = (name, x, y, cls, width = 150) =>
        `<g class="graph-node ${cls}" transform="translate(${x - width / 2},${y - 19})"><rect width="${width}" height="38" rx="8"></rect><text x="${width / 2}" y="24" text-anchor="middle" font-size="11" font-weight="650">${escapeHtml(name.length > 21 ? name.slice(0, 19) + '…' : name)}</text></g>`;
      let svg = '';
      if (subject) {
        const left = subject.suppliers.slice(0, 5);
        const right = subject.customers.slice(0, 5);
        const others = rels.filter(rel => rel.to !== subjectName && rel.from !== subjectName).slice(0, 4);
        const rowCount = Math.max(left.length, right.length, 1);
        const height = Math.max(180, rowCount * 62 + 40);
        const cx = 340, leftX = 110, rightX = 570;
        const edges = [];
        const yFor = (index, count) => (height / (count + 1)) * (index + 1);
        left.forEach((rel, index) => {
          const y = yFor(index, left.length);
          edges.push(`<path class="graph-edge supply" d="M ${leftX + 75} ${y} C ${(leftX + cx) / 2} ${y}, ${(leftX + cx) / 2} ${height / 2}, ${cx - 80} ${height / 2}" marker-end="url(#ai-supply-arrow)"></path>`);
          edges.push(nodeBox(rel.from, leftX, y, 'supplier'));
        });
        right.forEach((rel, index) => {
          const y = yFor(index, right.length);
          edges.push(`<path class="graph-edge supply" d="M ${cx + 80} ${height / 2} C ${(cx + rightX) / 2} ${height / 2}, ${(cx + rightX) / 2} ${y}, ${rightX - 75} ${y}" marker-end="url(#ai-supply-arrow)"></path>`);
          edges.push(nodeBox(rel.to, rightX, y, 'customer'));
        });
        edges.push(nodeBox(subjectName, cx, height / 2, 'root'));
        svg = `<div class="graph-frame" style="margin-top:10px"><svg class="graph-svg" viewBox="0 0 680 ${height}" role="img" aria-label="Discovered relationship diagram">
          <defs><marker id="ai-supply-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2589a1"></path></marker></defs>
          ${edges.join('')}
        </svg></div>`;
      }
      const flowRows = rels.map(rel => `<div class="ai-flow">
        <strong>${escapeHtml(rel.from)}</strong><span class="ai-flow-arrow">→</span>
        <span class="ai-flow-via">${escapeHtml(rel.via || 'commercial relationship')}</span><span class="ai-flow-arrow">→</span>
        <strong>${escapeHtml(rel.to)}</strong>
        ${aiEvidenceTag(rel.evidence)}${aiSourceInline(report, rel.sourceIds)}
      </div>`).join('');
      return `${svg}<div style="margin-top:10px">${flowRows}</div>`;
    }

    function renderAIReport(message) {
      const report = message.report, meta = message.meta || {};
      const addable = (report.companies || []).filter(company => !company.dbId && !aiCompanyExists(company.name));
      const engineBadge = meta.engine === 'dataset-only'
        ? `<span class="tag unverified">Dataset-only mode</span>`
        : `<span class="tag source-checked">AI research · ${escapeHtml(meta.provider || 'ai')}${meta.model ? ` · ${escapeHtml(meta.model)}` : ''}</span>`;
      const warnings = (meta.warnings || []).map(warning => `<li>${escapeHtml(warning)}</li>`).join('');
      const stageSummary = AI_STAGES.map(([key, label]) => {
        const ran = meta.stages?.[key] !== false;
        return `<span class="tag ${ran ? 'source-checked' : ''}" title="${ran ? 'Ran during this research' : 'Did not produce results in this run'}">${ran ? '✓' : '—'} ${escapeHtml(label)}</span>`;
      }).join(' ');
      return `<div class="ai-msg">
        <div class="ai-msg-label">Research report ${meta.cached ? '· cached' : ''} · ${(meta.tookMs / 1000).toFixed(1)}s${meta.evidenceCount != null ? ` · ${meta.evidenceCount} evidence items` : ''}</div>
        <div style="margin-bottom:8px">${engineBadge}</div>
        <h3>${escapeHtml(report.title)}</h3>
        <p><strong>Executive summary.</strong> ${escapeHtml(report.executiveSummary)}</p>
        <div class="ai-report-section">
          <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.35px;margin-bottom:6px">Research stages</div>
          <div style="display:flex;flex-wrap:wrap;gap:5px">${stageSummary}</div>
        </div>
        ${warnings ? `<div class="notice" style="margin-top:12px"><strong>Verification warnings.</strong><ul style="margin:5px 0 0;padding-left:18px">${warnings}</ul></div>` : ''}
        <div class="toolbar" style="margin-top:12px">
          <button type="button" class="button primary" data-ai-visualize>Visualize in Supply Chain Map</button>
          <button type="button" class="button" data-ai-add-open ${addable.length ? '' : 'disabled'}>Add Companies to Database${addable.length ? ` (${addable.length})` : ''}</button>
        </div>
        <div class="ai-report-section">
          <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.35px;margin-bottom:6px">Identified companies (${(report.companies || []).length})</div>
          ${(report.companies || []).map(company => aiCompanyCard(report, company)).join('') || '<p class="muted">No companies passed the evidence rules for this question.</p>'}
        </div>
        ${(report.relationships || []).length ? `<div class="ai-report-section"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.35px;margin-bottom:6px">Relationship explanation</div>${aiRelationshipDiagram(report)}</div>` : ''}
        ${(report.investmentImplications || []).length ? `<div class="ai-report-section"><div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.35px;margin-bottom:6px">Investment implications</div><ul style="margin:0;padding-left:18px">${report.investmentImplications.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul><p class="footer-note">Distinguish disclosed revenue exposure (evidence-backed) from potential indirect benefit (analyst reasoning) per the notes above.</p></div>` : ''}
        <details class="ai-report-section" ${report.risks?.length ? 'open' : ''}><summary>Risks &amp; limitations</summary>
          ${(report.risks || []).length ? `<strong style="font-size:12px">Risks</strong><ul style="margin:4px 0 10px;padding-left:18px">${report.risks.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : ''}
          ${(report.limitations || []).length ? `<strong style="font-size:12px">Limitations</strong><ul style="margin:4px 0 0;padding-left:18px">${report.limitations.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : ''}
          ${(report.missingInformation || []).length ? `<strong style="font-size:12px">Missing information</strong><ul style="margin:8px 0 0;padding-left:18px">${report.missingInformation.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` : ''}
        </details>
        <details class="ai-report-section" open><summary>Sources (${(report.sources || []).length})</summary>
          ${(report.sources || []).map(source => {
            const href = safeUrl(source.url || '');
            return `<div class="ai-source">
              <div>${href !== '#' ? `<a href="${href}" target="_blank" rel="noopener noreferrer"><strong>${escapeHtml(source.title)}</strong></a>` : `<strong>${escapeHtml(source.title)}</strong>`}</div>
              <div class="ai-card-meta">${escapeHtml(source.publisher || 'Unknown publisher')}${source.date ? ` · ${escapeHtml(source.date)}` : ''}${source.id ? ` · id ${escapeHtml(source.id)}` : ''}</div>
              ${source.verifies ? `<div class="muted" style="font-size:12px">Verifies: ${escapeHtml(source.verifies)}</div>` : ''}
            </div>`;
          }).join('') || '<p class="muted">No sources survived verification for this report.</p>'}
        </details>
        ${report.confidenceNote ? `<p class="footer-note" style="margin-top:10px">${escapeHtml(report.confidenceNote)}</p>` : ''}
      </div>`;
    }

    function renderAIRight(report) {
      if (!report) return `<section class="panel"><h2>Research context</h2><p class="muted">Companies, relationships and sources from your latest research will appear here.</p></section>`;
      const companies = report.report.companies || [];
      const sources = report.report.sources || [];
      const rels = report.report.relationships || [];
      const dbCompanies = companies.filter(company => company.dbId && companyById[company.dbId]).slice(0, 6);
      const connections = dbCompanies.map(company => {
        const direct = directConnections(company.dbId);
        const suppliers = direct.filter(row => row.role === 'supplier').map(row => companyById[row.otherId].name);
        const customers = direct.filter(row => row.role === 'customer').map(row => companyById[row.otherId].name);
        return `<div class="row"><div class="row-main">${companyLink(company.dbId)}<small>${suppliers.length ? `Suppliers: ${escapeHtml(suppliers.slice(0, 4).join(', '))}` : ''}${suppliers.length && customers.length ? ' · ' : ''}${customers.length ? `Customers: ${escapeHtml(customers.slice(0, 4).join(', '))}` : ''}${!suppliers.length && !customers.length ? 'No dataset connections recorded' : ''}</small></div></div>`;
      }).join('');
      return `<div style="display:flex;flex-direction:column;gap:14px">
        <section class="panel"><h2>Companies mentioned (${companies.length})</h2>
          <div class="ai-side-list">${companies.map(company => {
            const inDb = company.dbId && companyById[company.dbId];
            return `<div class="row"><div class="row-main">${inDb ? companyLink(company.dbId) : `<strong>${escapeHtml(company.name)}</strong> <span class="tag">not in database</span>`}<small>${escapeHtml(company.ticker || company.exchange || company.country || '')} · ${escapeHtml(company.role || '')}</small></div>${aiEvidenceTag(company.evidence)}</div>`;
          }).join('') || '<p class="muted">None yet.</p>'}</div>
        </section>
        <section class="panel"><h2>Important relationships (${rels.length})</h2>
          <div class="ai-side-list">${rels.slice(0, 10).map(rel => `<div class="row"><div class="row-main"><strong>${escapeHtml(rel.from)}</strong> → <strong>${escapeHtml(rel.to)}</strong><small>${escapeHtml(rel.via || '')}</small></div>${aiEvidenceTag(rel.evidence)}</div>`).join('') || '<p class="muted">None yet.</p>'}</div>
        </section>
        <section class="panel"><h2>Research sources (${sources.length})</h2>
          <div class="ai-side-list">${sources.slice(0, 12).map(source => {
            const href = safeUrl(source.url || '');
            return `<div class="row"><div class="row-main">${href !== '#' ? `<a href="${href}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.publisher || source.title)}</a>` : escapeHtml(source.title)}<small class="ai-truncate-2">${escapeHtml(source.title)}</small></div></div>`;
          }).join('') || '<p class="muted">None yet.</p>'}</div>
        </section>
        ${dbCompanies.length ? `<section class="panel"><h2>Existing dataset connections</h2>${connections}<p class="footer-note">Direct links recorded in your curated dataset for companies found by this research.</p></section>` : ''}
      </div>`;
    }

    function renderAIStages() {
      const tick = AI.loading?.stageTick || 0;
      return `<div class="ai-stages" role="status">
        ${AI_STAGES.map(([key, label], index) => {
          const cls = index === tick ? 'active' : '';
          return `<div class="ai-stage ${cls}"><span class="ai-stage-dot"></span>${escapeHtml(label)}${cls ? '…' : ''}</div>`;
        }).join('')}
        <p class="footer-note" style="margin-top:6px">Stages run on the backend against live sources. No verification status is shown until evidence has actually been returned.</p>
      </div>`;
    }

    function renderAILeft(session) {
      const sessions = AI.sessions.slice(0, 20);
      const saved = AI.sessions.filter(item => item.saved).slice(0, 10);
      return `<section class="panel">
        <button type="button" class="button primary" style="width:100%" data-ai-new>+ New research</button>
        <label class="field-label" for="ai-mode" style="margin-top:12px">Research mode</label>
        <select id="ai-mode">${AI_MODES.map(([value, label]) => `<option value="${value}" ${AI.mode === value ? 'selected' : ''}>${label}</option>`).join('')}</select>
        <h2 style="margin-top:14px">Previous research</h2>
        <div class="ai-side-list">${sessions.map(item => `<div class="ai-session-item ${item.id === AI.activeId ? 'active' : ''}" role="button" tabindex="0" data-ai-session="${escapeHtml(item.id)}">
            <span class="ai-truncate-2"><strong>${escapeHtml(item.title)}</strong><small>${new Date(item.created).toLocaleString()} · ${item.messages.length} messages${item.saved ? ' · saved' : ''}</small></span>
            <button type="button" class="ai-session-del" data-ai-delete="${escapeHtml(item.id)}" aria-label="Delete session" title="Delete">✕</button>
          </div>`).join('') || '<p class="muted">No sessions yet.</p>'}
        </div>
        <h2 style="margin-top:14px">Saved reports</h2>
        <div class="ai-side-list">${saved.map(item => `<div class="ai-session-item" role="button" tabindex="0" data-ai-session="${escapeHtml(item.id)}"><span class="ai-truncate-2"><strong>★ ${escapeHtml(item.title)}</strong><small>${new Date(item.created).toLocaleDateString()}</small></span></div>`).join('') || '<p class="muted">Save a session to pin its report here.</p>'}</div>
      </section>`;
    }

    function renderAIMain(session) {
      const health = AI.backend;
      const backendNotice = AI.backendChecked && !health
        ? `<div class="notice"><strong>Backend not reachable.</strong> ${escapeHtml(AI_BACKEND_UNREACHABLE)}</div>`
        : '';
      const aiNotice = health && !health.ai.configured
        ? `<div class="notice info"><strong>Dataset-only mode active.</strong> ${escapeHtml(health.ai.error || 'No AI provider configured.')} Live web research needs an AI provider key plus a search key (e.g. TAVILY_API_KEY) in <code>backend/.env</code>. Search sources currently active: ${escapeHtml((health.search?.providers || []).join(', ') || 'none')}.</div>`
        : health && health.ai.configured && !(health.search?.providers || []).some(provider => provider !== 'edgar')
          ? `<div class="notice info"><strong>Limited web search.</strong> An AI provider is configured, but no web-search API key is set — evidence will come from SEC EDGAR only. Add TAVILY_API_KEY or BRAVE_API_KEY to <code>backend/.env</code> for broader coverage.</div>`
          : '';
      const messages = session ? session.messages.map(message => {
        if (message.role === 'user') {
          return `<div class="ai-msg user"><div class="ai-msg-label">Research question</div><strong>${escapeHtml(message.text)}</strong></div>`;
        }
        if (message.error) {
          return `<div class="ai-msg ai-error"><div class="ai-msg-label" style="color:var(--red)">Research failed</div><p style="margin:0">${escapeHtml(message.error)}</p>${message.hint ? `<p class="muted" style="margin-top:6px">${escapeHtml(message.hint)}</p>` : ''}</div>`;
        }
        return renderAIReport(message);
      }).join('') : '';
      const loadingBlock = AI.loading && session && AI.loading.sessionId === session.id ? renderAIStages() : '';
      const welcome = !session || !session.messages.length ? `
        <h1>AI Research Assistant</h1>
        <p class="muted">Ask a research question about publicly traded companies, suppliers, customers, supply chains or investment opportunities. The assistant connects to your existing company database, runs live public-source research and returns an evidence-cited report.</p>
        <div class="ai-suggest" style="margin-top:12px">${AI_SUGGESTIONS.map(question => `<button type="button" data-ai-suggest="${escapeHtml(question)}">${escapeHtml(question)}</button>`).join('')}</div>` : '';
      return `${backendNotice}${aiNotice}${welcome}
        <div class="ai-chat" id="ai-chat" style="margin-top:12px">${messages}${loadingBlock}</div>
        <form id="ai-form" class="ai-bubble-input">
          <input id="ai-question" class="input" placeholder="Ask a research question, e.g. “Who supplies NVIDIA's HBM memory?”" autocomplete="off" ${AI.loading ? 'disabled' : ''}>
          <button type="submit" class="button primary" ${AI.loading ? 'disabled' : ''}>${AI.loading ? 'Researching…' : 'Research'}</button>
        </form>
        <p class="footer-note">Relationship claims are only made with evidence from your dataset or from live public sources. Confirmed = primary/official source, Reported = credible media, Inferred = analytical reasoning, Unverified = insufficient evidence.</p>`;
    }

    function renderAI() {
      if (!AI.backendChecked) aiCheckBackend();
      const session = aiActiveSession();
      const reportMessage = lastAssistantReport(session);
      return `<div class="ai-layout">
        ${renderAILeft(session)}
        <section class="panel">${renderAIMain(session)}</section>
        ${renderAIRight(reportMessage)}
      </div>${AI.modalOpen ? renderAIAddModal() : ''}`;
    }

    function renderAIAddModal() {
      const companies = AI.modalCompanies;
      return `<div class="ai-modal-backdrop" role="dialog" aria-modal="true" aria-label="Add discovered companies">
        <div class="ai-modal">
          <div class="company-header"><div><h1 style="font-size:19px">Review discovered companies</h1><p class="muted">From: ${escapeHtml(AI.modalReportTitle)}</p></div>
            <button type="button" class="button" data-ai-close-modal>Close</button></div>
          <div class="notice" style="margin-top:10px"><strong>Explicit approval required.</strong> Only the companies you check below are added. Existing company records and verified relationships are never overwritten. Added companies appear in the Company Explorer, tables and watchlist; map pins are only drawn where verified headquarters coordinates exist.</div>
          ${companies.map((company, index) => `<div class="row">
            <label class="check"><input type="checkbox" data-ai-add-check="${index}"> <span><strong>${escapeHtml(company.name)}</strong><br><small class="muted">${escapeHtml([company.ticker, company.exchange, company.country, company.industry].filter(Boolean).join(' · ') || 'Details unknown')}</small></span></label>
            ${aiEvidenceTag(company.evidence)}
          </div>`).join('') || '<p class="muted">Every company in this report is already in the database.</p>'}
          <div class="toolbar" style="margin-top:12px;justify-content:flex-end">
            <button type="button" class="button" data-ai-close-modal>Cancel</button>
            <button type="button" class="button primary" data-ai-add-confirm ${companies.length ? '' : 'disabled'}>Add selected to database</button>
          </div>
        </div>
      </div>`;
    }

    function persistApprovedCompanies() {
      try { localStorage.setItem('sci_added_companies', JSON.stringify(APPROVED_COMPANIES)); } catch {}
    }
    function aiConfirmAdd() {
      const checked = [...document.querySelectorAll('[data-ai-add-check]:checked')].map(input => Number(input.dataset.aiAddCheck));
      let added = 0;
      for (const index of checked) {
        const company = AI.modalCompanies[index];
        if (!company || aiCompanyExists(company.name)) continue;
        const baseId = `r-${aiNormalizeName(company.name).replace(/\s+/g, '-')}`;
        let id = baseId, suffix = 2;
        while (companyById[id]) id = `${baseId}-${suffix++}`;
        const record = {
          id,
          name: company.name,
          ticker: company.ticker ? (company.exchange ? `${company.ticker} · ${company.exchange}` : company.ticker) : 'Not publicly listed / unknown',
          hq: company.country || 'Unknown',
          country: company.country || 'Unknown',
          industry: company.industry || 'Unknown',
          website: '',
          description: `${company.relationship || 'Discovered via AI research'} (added from AI research: ${AI.modalReportTitle}; evidence: ${company.evidence}).`
        };
        COMPANIES.push(record);
        APPROVED_COMPANIES.push(record);
        companyById[id] = record;
        added++;
      }
      persistApprovedCompanies();
      AI.modalOpen = false;
      notify(added ? `Added ${added} compan${added === 1 ? 'y' : 'ies'} to the database.` : 'No new companies were added (already present).');
      render();
    }

    function aiVisualize(message) {
      const report = message.report;
      const companies = (report.companies || []).map(company => ({ name:company.name, dbId: company.dbId || aiResolveDbId(company.name) }));
      const links = (report.relationships || []).map(rel => ({ from:rel.from, to:rel.to, via:rel.via, fromDbId:aiResolveDbId(rel.from), toDbId:aiResolveDbId(rel.to) }));
      const subjectDbId = report.subject?.dbId || (report.subject?.name ? aiResolveDbId(report.subject.name) : null) || companies.find(company => company.dbId)?.dbId || null;
      state.researchOverlay = { title:report.title, companies, links };
      state.view = 'map';
      state.mapShowLinks = true;
      state.mapSelected = subjectDbId ? `hq:${subjectDbId}` : '';
      render();
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function researchOverlayLinks(hqPositionByCompany) {
      const overlay = state.researchOverlay;
      if (!overlay) return '';
      return overlay.links.map(link => {
        const from = hqPositionByCompany.get(link.fromDbId), to = hqPositionByCompany.get(link.toDbId);
        if (!from || !to) return '';
        return `<line class="map-link" stroke="#a78bfa" stroke-dasharray="6 4" x1="${from.x}" y1="${from.y}" x2="${to.x}" y2="${to.y}" marker-end="url(#map-arrow-research)"><title>AI research: ${escapeHtml(link.from)} → ${escapeHtml(link.to)}${link.via ? `: ${escapeHtml(link.via)}` : ''}</title></line>`;
      }).join('');
    }
    function researchOverlayHtml() {
      const overlay = state.researchOverlay;
      if (!overlay) return '';
      const pinned = overlay.companies.filter(company => company.dbId && companyById[company.dbId] && HQ_COORDS[company.dbId]).length;
      return `<div class="notice info ai-map-overlay-note"><strong>AI research overlay active:</strong> “${escapeHtml(overlay.title)}” — ${overlay.companies.length} companies discovered, ${pinned} pinned on the map, ${overlay.links.length} research relationships drawn (dashed violet). <button type="button" class="button" data-clear-research-overlay>Clear overlay</button></div>`;
    }
    function researchOverlaySidebar() {
      const overlay = state.researchOverlay;
      if (!overlay) return '';
      const items = overlay.companies.map(company => {
        const inDb = company.dbId && companyById[company.dbId];
        const pinned = inDb && HQ_COORDS[company.dbId];
        return `<div class="map-company-item"><span><strong>${inDb ? '' : ''}${escapeHtml(company.name)}</strong><small>${pinned ? escapeHtml(companyById[company.dbId].name + ' · in database') : 'Not in database · no verified coordinates to pin'}</small></span><span class="tag ${pinned ? 'source-checked' : 'unverified'}">${pinned ? 'Pinned' : 'Unpinned'}</span></div>`;
      }).join('');
      return `<div class="map-selected"><div class="company-header"><strong>AI research companies</strong><span class="muted">${overlay.companies.length}</span></div><div class="map-company-list">${items}</div></div>`;
    }

    document.addEventListener('submit', event => {
      if (event.target.id !== 'ai-form') return;
      event.preventDefault();
      const question = AI.draft.trim();
      if (question.length >= 3 && !AI.loading) aiAsk(question);
    });
    document.addEventListener('click', event => {
      const suggest = event.target.closest('[data-ai-suggest]');
      if (suggest) { AI.draft = suggest.dataset.aiSuggest; AI.focusInput = true; render(); return; }
      if (event.target.closest('[data-ai-new]')) { aiNewSession(); saveResearchSessions(); AI.focusInput = true; render(); return; }
      const deleteButton = event.target.closest('[data-ai-delete]');
      if (deleteButton) {
        const id = deleteButton.dataset.aiDelete;
        AI.sessions = AI.sessions.filter(session => session.id !== id);
        if (AI.activeId === id) AI.activeId = AI.sessions[0]?.id || null;
        saveResearchSessions(); render(); return;
      }
      const sessionItem = event.target.closest('[data-ai-session]');
      if (sessionItem) { AI.activeId = sessionItem.dataset.aiSession; AI.focusInput = false; render(); return; }
      if (event.target.closest('[data-ai-visualize]')) {
        const session = aiActiveSession();
        const message = lastAssistantReport(session);
        if (message) aiVisualize(message);
        return;
      }
      if (event.target.closest('[data-ai-add-open]')) {
        const session = aiActiveSession();
        const message = lastAssistantReport(session);
        if (!message) return;
        AI.modalCompanies = (message.report.companies || []).filter(company => !company.dbId && !aiCompanyExists(company.name));
        AI.modalReportTitle = message.report.title;
        AI.modalOpen = true;
        render(); return;
      }
      if (event.target.closest('[data-ai-add-confirm]')) { aiConfirmAdd(); return; }
      if (event.target.closest('[data-ai-close-modal]')) { AI.modalOpen = false; render(); return; }
      if (event.target.closest('[data-clear-research-overlay]')) { state.researchOverlay = null; render(); return; }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && AI.modalOpen) { AI.modalOpen = false; render(); return; }
      const sessionItem = event.target.closest?.('.ai-session-item[data-ai-session]');
      if (sessionItem && (event.key === 'Enter' || event.key === ' ')) { event.preventDefault(); AI.activeId = sessionItem.dataset.aiSession; render(); }
    });
    document.addEventListener('change', event => {
      if (event.target.id === 'ai-mode') { AI.mode = event.target.value; }
    });
    document.addEventListener('input', event => {
      if (event.target.id === 'ai-question') AI.draft = event.target.value;
    });

    render();
  </script>
</body>
</html>
