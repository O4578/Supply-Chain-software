<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>SupplyChain Intelligence</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14; --panel: rgba(16,26,46,.78); --panel-2: #0a1220;
      --line: #1f2d46; --text: #d9e2f1; --muted: #8795ad;
      --cyan: #22d3ee; --blue: #4f8cff; --amber: #f5b942;
      --red: #f0616d; --violet: #a78bfa; --green: #34d399;
      --radius: 10px;
    }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 12px; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      background: radial-gradient(1200px 600px at 80% -10%, #10223f 0, var(--bg) 60%) fixed var(--bg);
      font: 13px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid var(--cyan); outline-offset: 2px;
    }
    .topbar {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px;
      padding: 11px 20px; border-bottom: 1px solid var(--line);
      background: rgba(8,13,25,.94); backdrop-filter: blur(14px); flex-wrap: wrap;
    }
    .logo { color: var(--amber); font-size: 15px; font-weight: 750; white-space: nowrap; letter-spacing: .1px; }
    .logo span { color: var(--cyan); }
    .search-wrap { position: relative; flex: 1; min-width: 240px; max-width: 560px; }
    .search-input, .input, select {
      width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px;
      background: var(--panel-2); color: var(--text);
    }
    .search-input::placeholder, .input::placeholder { color: #70809a; }
    .search-results {
      display: none; position: absolute; top: calc(100% + 5px); left: 0; right: 0; z-index: 30;
      max-height: 340px; overflow: auto; padding: 5px; border: 1px solid var(--line);
      border-radius: 8px; background: #0b1424; box-shadow: 0 18px 45px #0009;
    }
    .search-results.open { display: block; }
    .search-result {
      width: 100%; display: flex; justify-content: space-between; gap: 12px; text-align: left;
      padding: 9px 10px; border: 0; border-radius: 5px; color: var(--text); background: transparent; cursor: pointer;
    }
    .search-result:hover, .search-result.active { background: #16243d; }
    .search-result small { color: var(--muted); text-align: right; }
    .pill, .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; font-size: 11px; white-space: nowrap; }
    .pill.demo { color: var(--amber); border-color: #765a24; background: #f5b94212; }
    nav { display: flex; gap: 3px; padding: 0 18px; border-bottom: 1px solid var(--line); overflow-x: auto; background: #080d19a8; }
    nav button { flex: 0 0 auto; padding: 11px 12px 9px; border: 0; border-bottom: 2px solid transparent; color: var(--muted); background: none; cursor: pointer; white-space: nowrap; }
    nav button:hover { color: var(--text); }
    nav button.active { color: var(--cyan); border-bottom-color: var(--cyan); }
    main { max-width: 1560px; margin: 0 auto; padding: 18px 20px 44px; }
    .grid { display: grid; gap: 14px; }
    .grid-4 { grid-template-columns: repeat(4, minmax(0,1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .grid-main { grid-template-columns: minmax(290px, 360px) minmax(0,1fr); }
    .panel { min-width: 0; padding: 15px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); box-shadow: 0 8px 30px #00000012; }
    .panel h2 { margin: 0 0 10px; color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .35px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(21px, 3vw, 27px); line-height: 1.2; }
    h3 { margin: 0 0 7px; font-size: 14px; }
    p { margin: 9px 0; }
    .muted { color: var(--muted); }
    .kpi { color: var(--cyan); font: 650 28px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .kpi-label { margin-bottom: 7px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
    .notice { margin-bottom: 14px; padding: 10px 13px; border-left: 3px solid var(--amber); border-radius: 5px; background: #f5b9420c; color: #d7d0bd; }
    .notice strong { color: var(--amber); }
    .notice.info { border-left-color: var(--cyan); background: #22d3ee0b; }
    .ai-layout { display: grid; grid-template-columns: 240px minmax(0,1fr) 300px; gap: 14px; align-items: start; }
    .ai-chat { display: flex; flex-direction: column; gap: 12px; min-height: 420px; }
    .ai-msg { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .ai-msg.user { border-color: #155b69; background: #0c2733; }
    .ai-msg .ai-msg-label { margin-bottom: 6px; color: var(--muted); font-size: 10px; font-weight: 650; letter-spacing: .4px; text-transform: uppercase; }
    .ai-msg.user .ai-msg-label { color: var(--cyan); }
    .ai-bubble-input { display: flex; gap: 8px; margin-top: 12px; }
    .ai-bubble-input .input { flex: 1; }
    .ai-stages { display: flex; flex-direction: column; gap: 7px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .ai-stage { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 12px; }
    .ai-stage.active { color: var(--cyan); }
    .ai-stage.done { color: var(--green); }
    .ai-stage .ai-stage-dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
    .ai-stage.active .ai-stage-dot { border-color: var(--cyan); background: #22d3ee33; animation: ai-pulse 1.1s ease-in-out infinite; }
    .ai-stage.done .ai-stage-dot { border-color: #236d54; background: var(--green); }
    @keyframes ai-pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    .ai-suggest { display: flex; flex-wrap: wrap; gap: 7px; }
    .ai-suggest button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 99px; color: var(--text); background: var(--panel-2); cursor: pointer; font-size: 12px; text-align: left; }
    .ai-suggest button:hover { border-color: var(--cyan); color: var(--cyan); }
    .ai-report-section { margin-top: 12px; }
    .ai-report-section summary { cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 650; letter-spacing: .35px; text-transform: uppercase; padding: 6px 0; }
    .ai-report-section summary:hover { color: var(--cyan); }
    .ai-company-card { display: block; padding: 11px 12px; margin-bottom: 9px; border: 1px solid var(--line); border-radius: 8px; background: #0b1424; }
    .ai-company-card:hover { border-color: #2a3c5c; }
    .ai-company-card .ai-card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .ai-card-logo { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 6px; background: #16243d; color: var(--cyan); font-size: 11px; font-weight: 750; vertical-align: middle; }
    .ai-card-meta { color: var(--muted); font-size: 11px; }
    .ai-flow { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; padding: 8px 0; border-bottom: 1px solid #16223a; font-size: 12px; }
    .ai-flow:last-child { border-bottom: 0; }
    .ai-flow .ai-flow-arrow { color: var(--amber); }
    .ai-flow .ai-flow-via { color: var(--muted); }
    .tag.ev-confirmed { color: var(--green); border-color: #236d54; }
    .tag.ev-reported { color: var(--cyan); border-color: #155b69; }
    .tag.ev-inferred { color: var(--violet); border-color: #55427f; }
    .tag.ev-unknown { color: var(--muted); }
    .ai-conf { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; vertical-align: middle; }
    .ai-conf.high { background: var(--green); }
    .ai-conf.medium { background: var(--amber); }
    .ai-conf.low { background: var(--red); }
    .ai-source { padding: 8px 0; border-bottom: 1px solid #16223a; }
    .ai-source:last-child { border-bottom: 0; }
    .ai-side-list { max-height: 420px; overflow: auto; }
    .ai-session-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; padding: 8px 9px; border: 0; border-radius: 6px; color: var(--text); background: transparent; cursor: pointer; text-align: left; }
    .ai-session-item:hover, .ai-session-item.active { background: #16243d; }
    .ai-session-item small { display: block; color: var(--muted); }
    .ai-session-item .ai-session-del { flex: 0 0 auto; padding: 2px 7px; border: 1px solid transparent; border-radius: 5px; color: var(--muted); background: none; cursor: pointer; }
    .ai-session-item .ai-session-del:hover { color: #ff9da5; border-color: #713943; }
    .ai-modal-backdrop { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 20px; background: #04070eb8; }
    .ai-modal { width: min(620px, 100%); max-height: 80vh; overflow: auto; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: #0a1220; box-shadow: 0 30px 70px #000c; }
    .ai-map-overlay-note { margin-top: 10px; }
    .ai-truncate-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .ai-error { border-color: #713943; background: #f0616d0d; }
    @media (max-width: 1180px) {
      .ai-layout { grid-template-columns: minmax(0,1fr); }
      .ai-chat { min-height: 0; }
    }
    .company-link { display: inline; padding: 0; border: 0; color: var(--cyan); background: none; cursor: pointer; text-align: left; }
    .company-link:hover { text-decoration: underline; }
    .company-link.large { color: var(--text); font-size: 16px; font-weight: 700; }
    .button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 11px; border: 1px solid var(--line); border-radius: 7px; color: var(--text); background: var(--panel-2); cursor: pointer; }
    .button:hover { border-color: var(--cyan); }
    .button.primary { border-color: #157c8a; background: #0d3541; color: #a5f3fc; }
    .button.danger { color: #ff9da5; }
    .button:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #16223a; }
    .row:last-child { border-bottom: 0; }
    .row-main { min-width: 0; }
    .row-main small { display: block; color: var(--muted); }
    .tag.high { color: var(--green); border-color: #236d54; }
    .tag.medium { color: var(--amber); border-color: #765a24; }
    .tag.low { color: var(--red); border-color: #713943; }
    .tag.unverified { color: var(--amber); border-color: #765a24; background: #f5b9420b; }
    .tag.source-checked { color: var(--green); border-color: #236d54; background: #34d3990b; }
    .tag.source-official { color: var(--cyan); border-color: #155b69; background: #22d3ee0b; }
    .tag.critical { color: var(--amber); border-color: #765a24; }
    .tag.direct { color: var(--cyan); border-color: #155b69; }
    .tag.indirect { color: var(--violet); border-color: #55427f; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 760px; }
    th { padding: 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 11px; font-weight: 600; text-align: left; white-space: nowrap; }
    td { padding: 9px 8px; border-bottom: 1px solid #16223a; vertical-align: top; }
    tbody tr:hover { background: #ffffff05; }
    .dot { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; vertical-align: middle; }
    .field-label { display: block; margin: 0 0 5px; color: var(--muted); font-size: 11px; }
    .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 9px 0 12px; }
    .toolbar .input { width: min(260px, 100%); }
    .toolbar select { width: auto; min-width: 95px; }
    .check { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
    .check input { accent-color: var(--cyan); }
    .company-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .company-description { color: #b5c1d4; }
    .profile-table { min-width: 0; }
    .profile-table td:first-child { width: 125px; color: var(--muted); }
    .graph-frame { min-height: 420px; overflow: auto; border: 1px solid #17253d; border-radius: 8px; background: radial-gradient(circle at 50% 50%, #0d1a30, #060a13); }
    .graph-svg { display: block; width: 100%; min-width: 680px; height: auto; }
    .graph-node { cursor: pointer; }
    .graph-node rect { stroke: #33445f; stroke-width: 1.4; fill: #101d32; }
    .graph-node.root rect { stroke: var(--amber); stroke-width: 2.2; fill: #332817; }
    .graph-node.supplier rect { stroke: #1b8192; }
    .graph-node.customer rect { stroke: #386bc0; }
    .graph-node.competitor rect { stroke: #8a3e49; }
    .graph-node.partner rect { stroke: #67539a; }
    .graph-node text { pointer-events: none; fill: var(--text); font-family: inherit; }
    .graph-node .sub { fill: var(--muted); font-size: 10px; }
    .graph-node.dim { opacity: .17; }
    .graph-node.hit rect { stroke: #fff; stroke-width: 3; }
    .graph-edge { fill: none; stroke-width: 2; opacity: .8; }
    .graph-edge.supply { stroke: #2589a1; }
    .graph-edge.competitor { stroke: var(--red); stroke-dasharray: 6 5; }
    .graph-edge.partner { stroke: var(--violet); }
    .graph-edge.critical { stroke: var(--amber); stroke-width: 3; }
    .graph-legend { display: flex; flex-wrap: wrap; gap: 13px; margin: 9px 0; color: var(--muted); font-size: 11px; }

    .map-layout { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:14px; align-items:stretch; margin-top:12px; }
    .world-map-wrap { min-width:0; overflow:hidden; border:1px solid #1b2b45; border-radius:9px; background:#081321; }
    .world-map { display:block; width:100%; height:auto; min-height:360px; }
    .map-land { fill:#142943; stroke:#2a4565; stroke-width:1.2; stroke-linejoin:round; }
    .map-grid { stroke:#1b304b; stroke-width:1; stroke-dasharray:3 7; opacity:.8; }
    .map-region-label { fill:#46617f; font-size:13px; letter-spacing:2px; font-weight:650; text-anchor:middle; pointer-events:none; }
    .map-link { fill:none; stroke:#f5b942; stroke-width:2.4; opacity:.85; }
    .map-leader { stroke:#53708f; stroke-width:1; opacity:.75; }
    .map-pin { cursor:pointer; outline:none; }
    .map-pin .pin-core { stroke:#07111e; stroke-width:2.4; }
    .map-pin circle.pin-halo { fill:none; stroke:#dce9f8; stroke-width:1; opacity:.35; }
    .map-pin.selected circle.pin-halo { stroke:var(--amber); stroke-width:3; opacity:1; }
    .map-pin:focus circle.pin-halo, .map-pin:hover circle.pin-halo { stroke:#fff; stroke-width:2.5; opacity:1; }
    .map-pin .map-label { fill:#e7f0ff; font-size:11px; font-weight:650; paint-order:stroke; stroke:#081321; stroke-width:3px; stroke-linejoin:round; opacity:0; pointer-events:none; }
    .map-pin:hover .map-label, .map-pin:focus .map-label, .map-pin.selected .map-label { opacity:1; }
    .map-sidebar { display:flex; flex-direction:column; gap:10px; min-height:0; }
    .map-selected { padding:12px; border:1px solid var(--line); border-radius:8px; background:#0a1424; }
    .map-company-list { max-height:310px; overflow:auto; padding-right:3px; }
    .map-company-item { width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:7px 8px; border:0; border-radius:6px; color:var(--text); background:transparent; text-align:left; cursor:pointer; }
    .map-company-item:hover, .map-company-item.active { background:#14243b; }
    .map-company-item small { display:block; color:var(--muted); }
    .map-legend { display:flex; flex-wrap:wrap; gap:10px 15px; margin-top:10px; color:var(--muted); font-size:11px; }
    .map-swatch.hq { border-radius:50%; }
    .map-swatch.diamond { border-radius:1px; transform:rotate(45deg); }
    .map-swatch.square { border-radius:1px; }
    .map-swatch.triangle { border-radius:0; clip-path:polygon(50% 0,0 100%,100% 100%); }
    .map-swatch.bar { width:12px; height:6px; border-radius:1px; }
    .map-legend span { display:inline-flex; align-items:center; gap:6px; }
    .map-swatch { width:9px; height:9px; display:inline-block; border-radius:50%; }
    .map-toolbar { display:flex; align-items:end; flex-wrap:wrap; gap:9px; margin-top:12px; }
    .map-toolbar .map-search { width:min(230px,100%); }
    .map-toolbar .map-select { width:auto; min-width:145px; }
    .map-zoom { display:flex; gap:5px; margin-left:auto; }
    .map-zoom .button { min-width:36px; }
    .map-kpis { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .map-kpi { padding:7px 10px; border:1px solid var(--line); border-radius:7px; background:#0a1424; }
    .map-kpi strong { color:var(--cyan); font:650 17px ui-monospace,Consolas,monospace; }
    @media (max-width:1000px) { .map-layout { grid-template-columns:1fr; } .map-company-list { max-height:220px; } }
    @media (max-width:600px) { .world-map { min-height:260px; } .map-toolbar .map-select { flex:1 1 140px; } .map-zoom { margin-left:0; } }

    .empty { padding: 22px 12px; color: var(--muted); text-align: center; }
    .empty strong { display: block; margin-bottom: 4px; color: var(--text); }
    .planned { max-width: 700px; }
    .footer-note { margin-top: 12px; color: var(--muted); font-size: 11px; }
    #toast { position: fixed; right: 18px; bottom: 18px; z-index: 50; max-width: min(420px, calc(100vw - 36px)); padding: 10px 14px; border: 1px solid var(--line); border-radius: 8px; background: #101d32; color: var(--text); box-shadow: 0 12px 30px #0008; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease; }
    #toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 1000px) { .grid-main { grid-template-columns: 1fr; } .grid-4 { grid-template-columns: repeat(2,minmax(0,1fr)); } .grid-3 { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { .topbar { gap: 10px; padding: 10px 12px; } .search-wrap { min-width: 100%; order: 3; } main { padding: 13px 12px 32px; } nav { padding: 0 8px; } .grid-4 { grid-template-columns: repeat(2,minmax(0,1fr)); } .panel { padding: 12px; } .graph-frame { min-height: 350px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">SupplyChain<span> Intelligence</span></div>
    <div class="search-wrap">
      <input id="company-search" class="search-input" type="search" autocomplete="off" spellcheck="false"
        placeholder="Search company, ticker, country or industry…" aria-label="Search companies"
        aria-autocomplete="list" aria-controls="search-results" aria-expanded="false">
      <div id="search-results" class="search-results" role="listbox" aria-label="Company search results"></div>
    </div>
    <span class="pill demo">PUBLIC-SOURCE SAMPLE</span>
  </header>
  <nav id="navigation" aria-label="Main navigation"></nav>
  <main id="app" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite"></div>

  <script>
    'use strict';

    // Single-file prototype: all app code, styles and seed data are contained here.
    // Relationship records explicitly store supplierId -> customerId for supply links.

      {id:'ssn',name:'Samsung Electronics',ticker:'005930 · KRX',hq:'Suwon, KR',country:'South Korea',industry:'Memory, foundry and devices',website:'samsung.com',description:'Memory, foundry, display and device manufacturer.'},

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }
    function safeUrl(value) {
      try { const url = new URL(value); return ['http:','https:'].includes(url.protocol) ? url.href : '#'; }
      catch { return '#'; }
    }
    function companyLink(id, label) {
      const company = companyById[id];
      if (!company) return escapeHtml(label || 'Unknown company');
      return `<button type="button" class="company-link" data-open-company="${escapeHtml(id)}">${escapeHtml(label || company.name)}</button>`;
    }
    function externalLink(url, label) {
      const href = safeUrl(url);
      if (href === '#') return `<span class="muted">${escapeHtml(label)}</span>`;
      return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
    }
    function loadWatchlist() {
      try {
        const raw = localStorage.getItem('sci_watchlist');
        const value = raw ? JSON.parse(raw) : [];
        if (!Array.isArray(value)) return [];
        return [...new Set(value.filter(id => typeof id === 'string' && Object.hasOwn(companyById, id)))];
      } catch (error) { return []; }
    }
    function saveWatchlist() {
      try { localStorage.setItem('sci_watchlist', JSON.stringify(state.watchlist)); return true; }
      catch (error) { notify('The browser blocked local storage. Your change may not persist after refresh.'); return false; }
    }
    function notify(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message; toast.classList.add('show');
      window.clearTimeout(notify.timer);
      notify.timer = window.setTimeout(() => toast.classList.remove('show'), 3000);
    }
    function validateData() {
      const errors = [];
      const allowed = ['supply','competitor','partner'];
      for (const rel of RELATIONSHIPS) {
        if (!allowed.includes(rel.type)) errors.push(`${rel.id}: unsupported type`);
        if (rel.type === 'supply') {
          if (!companyById[rel.supplierId] || !companyById[rel.customerId]) errors.push(`${rel.id}: invalid supplier/customer ID`);
          if (rel.supplierId === rel.customerId) errors.push(`${rel.id}: self-supply relationship`);
        } else if (!companyById[rel.companyA] || !companyById[rel.companyB]) errors.push(`${rel.id}: invalid company ID`);
        if (!SOURCES[rel.sourceId]) errors.push(`${rel.id}: missing source metadata`);
      }
      return errors;
    }
    const DATA_ERRORS = validateData();
    if (DATA_ERRORS.length) console.error('Supply-chain data validation errors:', DATA_ERRORS);

    const supplyByCustomer = new Map();
    const supplyBySupplier = new Map();
    const relationsByCompany = new Map(COMPANIES.map(company => [company.id, []]));
    for (const rel of RELATIONSHIPS) {
      if (rel.type === 'supply') {
        if (!supplyByCustomer.has(rel.customerId)) supplyByCustomer.set(rel.customerId, []);
        if (!supplyBySupplier.has(rel.supplierId)) supplyBySupplier.set(rel.supplierId, []);
        supplyByCustomer.get(rel.customerId).push(rel);
        supplyBySupplier.get(rel.supplierId).push(rel);
        relationsByCompany.get(rel.customerId)?.push(rel);
        relationsByCompany.get(rel.supplierId)?.push(rel);
      } else {
        relationsByCompany.get(rel.companyA)?.push(rel);
        relationsByCompany.get(rel.companyB)?.push(rel);
      }
    }

    function sourceFor(rel) {
      const source = SOURCES[rel.sourceId] || SOURCES['company-site'];
      if (rel.sourceId === 'company-site') {
        const company = companyById[rel.sourceCompanyId] || companyById[rel.customerId] || companyById[rel.companyA];
        return {title:company ? `${company.name} website (general reference)` : source.title,
          url:company ? `https://${company.website}` : null, scope:source.scope};
      }
      return source;
    }
    function assessmentTag(assessment) {
      const cls = assessment === 'H' ? 'high' : assessment === 'L' ? 'low' : 'medium';
      return `<span class="tag ${cls}" title="Qualitative assessment label, not a probability. See the linked evidence status separately.">${escapeHtml(CONFIDENCE_LABEL[assessment] || 'Unrated')}</span>`;
    }
    function evidenceCell(rel) {
      const source = sourceFor(rel);
      const link = source.url ? externalLink(source.url, source.title) : escapeHtml(source.title);
      const note = rel.evidenceNote || source.scope;
      const status = rel.evidenceStatus === 'primary'
        ? `<span class="tag source-checked">Primary source checked · ${DATA_REVIEWED_ON}</span>`
        : rel.evidenceStatus === 'official'
          ? `<span class="tag source-official">Official announcement checked · ${DATA_REVIEWED_ON}</span>`
          : '<span class="tag unverified">Reference only · unverified</span>';
      return `<div>${link}</div><div class="muted" style="font-size:11px">${escapeHtml(note)}</div><div style="margin-top:4px">${status}</div>`;
    }
    function directConnections(companyId) {
      const result = [];
      for (const rel of relationsByCompany.get(companyId) || []) {
        if (rel.type === 'supply') {
          const isSupplier = rel.customerId === companyId;
          result.push({rel,otherId:isSupplier ? rel.supplierId : rel.customerId,role:isSupplier ? 'supplier' : 'customer',depth:1,path:[companyId,isSupplier ? rel.supplierId : rel.customerId]});
        } else {
          const otherId = rel.companyA === companyId ? rel.companyB : rel.companyA;
          result.push({rel,otherId,role:rel.type,depth:1,path:[companyId,otherId]});
        }
      }
      return result;
    }
    // Directed BFS. Upstream follows customer <- supplier; downstream follows supplier -> customer.
    function walkSupplyChain(startId, direction, maxDepth) {
      const queue = [{id:startId,depth:0,path:[startId]}];
      const bestDepth = new Map([[startId,0]]);
      const seenEdges = new Set();
      const rows = [];
      while (queue.length) {
        const current = queue.shift();
        if (current.depth >= maxDepth) continue;
        const links = direction === 'upstream'
          ? (supplyByCustomer.get(current.id) || [])
          : (supplyBySupplier.get(current.id) || []);
        for (const rel of links) {
          const nextId = direction === 'upstream' ? rel.supplierId : rel.customerId;
          const edgeKey = rel.id;
          const nextDepth = current.depth + 1;
          const path = [...current.path,nextId];
          if (!seenEdges.has(edgeKey)) {
            rows.push({rel,otherId:nextId,role:direction === 'upstream' ? 'supplier' : 'customer',depth:nextDepth,path});
            seenEdges.add(edgeKey);
          }
          if (!bestDepth.has(nextId) || nextDepth < bestDepth.get(nextId)) {
            bestDepth.set(nextId,nextDepth);
            queue.push({id:nextId,depth:nextDepth,path});
          }
        }
      }
      return rows;
    }
    function getExplorerRows(companyId) {
      const directNonSupply = directConnections(companyId).filter(row => row.rel.type !== 'supply');
      const upstream = state.filters.suppliers ? walkSupplyChain(companyId,'upstream',state.depth) : [];
      const downstream = state.filters.customers ? walkSupplyChain(companyId,'downstream',state.depth) : [];
      const peers = directNonSupply.filter(row => state.filters[row.role]);
      const unique = new Map();
      for (const row of [...upstream,...downstream,...peers]) {
        const previous = unique.get(row.rel.id);
        if (!previous || row.depth < previous.depth) unique.set(row.rel.id,row);
      }
      return [...unique.values()].sort((a,b) => a.depth-b.depth || a.role.localeCompare(b.role) || companyById[a.otherId].name.localeCompare(companyById[b.otherId].name));
    }

    function buildGraphModel(rootId) {
      const nodes = new Map([[rootId,{id:rootId,side:'root',depth:0,role:'center'}]]);
      const edges = new Map();
      function addWalk(direction) {
        const enabled = direction === 'upstream' ? state.filters.suppliers : state.filters.customers;
        if (!enabled) return;
        const rows = walkSupplyChain(rootId,direction,state.depth);
        for (const row of rows) {
          const id = row.otherId;
          if (!nodes.has(id)) nodes.set(id,{id,side:direction,depth:row.depth,role:direction==='upstream'?'supplier':'customer'});
          else if (nodes.get(id).side !== 'root' && row.depth < nodes.get(id).depth) {
            nodes.set(id,{id,side:direction,depth:row.depth,role:direction==='upstream'?'supplier':'customer'});
          }
          edges.set(row.rel.id,{rel:row.rel,from:row.rel.supplierId,to:row.rel.customerId,kind:'supply'});
        }
      }
      addWalk('upstream'); addWalk('downstream');
      for (const row of directConnections(rootId)) {
        if (row.rel.type==='supply' || !state.filters[row.role]) continue;
        if (!nodes.has(row.otherId)) nodes.set(row.otherId,{id:row.otherId,side:'peer',depth:1,role:row.role});
        edges.set(row.rel.id,{rel:row.rel,from:row.rel.companyA,to:row.rel.companyB,kind:row.rel.type});
      }
      return {nodes:[...nodes.values()],edges:[...edges.values()]};
    }
    function renderGraph() {
      const container = document.getElementById('graph');
      if (!container) return;
      const model = buildGraphModel(state.selectedCompany);
      const depthGroups = new Map();
      for (const node of model.nodes) {
        if (node.side==='root') continue;
        const key = `${node.side}-${node.depth}`;
        if (!depthGroups.has(key)) depthGroups.set(key,[]);
        depthGroups.get(key).push(node);
      }
      const maxDepth = Math.max(1,...model.nodes.map(node=>node.depth));
      const maxColumnCount = Math.max(1,...[...depthGroups.values()].map(group=>group.length));
      const width = Math.max(960, maxDepth*190*2+200);
      const height = Math.max(470, maxColumnCount*94+110);
      const centerX = width/2, centerY = height/2;
      const positions = new Map();
      positions.set(state.selectedCompany,{x:centerX,y:centerY});
      for (const [key,group] of depthGroups) {
        const [side,depthText] = key.split('-'); const depth = Number(depthText);
        group.sort((a,b)=>companyById[a.id].name.localeCompare(companyById[b.id].name));
        const x = side==='upstream' ? centerX-depth*190 : side==='downstream' ? centerX+depth*190 : centerX;
        group.forEach((node,index)=>{
          let y;
          if (side==='peer') y = 55 + index*88;
          else y = (height/(group.length+1))*(index+1);
          positions.set(node.id,{x,y});
        });
      }
      const edgeMarkup = model.edges.map(edge=>{
        const start=positions.get(edge.from), end=positions.get(edge.to);
        if (!start || !end) return '';
        const dx=end.x-start.x, bend=Math.max(35,Math.abs(dx)*.35);
        const c1x=start.x+(dx>=0?bend:-bend), c2x=end.x-(dx>=0?bend:-bend);
        const cls=edge.kind==='supply'?'supply':edge.kind;
        const marker=edge.kind==='supply'?'url(#supply-arrow)':'';
        return `<path class="graph-edge ${cls} ${edge.rel.critical?'critical':''}" d="M ${start.x} ${start.y} C ${c1x} ${start.y}, ${c2x} ${end.y}, ${end.x} ${end.y}" ${marker?`marker-end="${marker}"`:''}><title>${escapeHtml(edge.rel.product)}</title></path>`;
      }).join('');
      const nodeMarkup = model.nodes.map(node=>{
        const company=companyById[node.id], pos=positions.get(node.id);
        const roleLabel=node.side==='root'?'SELECTED':node.role.toUpperCase();
        const name=company.name.length>19?company.name.slice(0,17)+'…':company.name;
        return `<g class="graph-node ${node.side==='root'?'root':node.role}" data-node-id="${escapeHtml(node.id)}" tabindex="0" role="button" aria-label="Open ${escapeHtml(company.name)} profile" transform="translate(${pos.x-72},${pos.y-25})">
          <rect width="144" height="50" rx="8"></rect>
          <text x="72" y="21" text-anchor="middle" font-size="12" font-weight="650">${escapeHtml(name)}</text>
          <text class="sub" x="72" y="37" text-anchor="middle">${escapeHtml(roleLabel)} · ${node.depth===0?'ROOT':`TIER ${node.depth}`}</text>
        </g>`;
      }).join('');
      const svg = `<svg class="graph-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Relationship graph for ${escapeHtml(companyById[state.selectedCompany].name)}">
        <defs><marker id="supply-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2589a1"></path></marker></defs>
        ${edgeMarkup}${nodeMarkup}</svg>`;
      container.innerHTML = model.nodes.length===1
        ? `<div class="empty"><strong>No visible relationships at these settings</strong>Try enabling another relationship type or increasing the supply-chain depth.</div>`
        : svg;
      applyGraphSearch();
    }
    function applyGraphSearch() {

        const label=node.textContent.toLowerCase();
        const match=!!query && label.includes(query);
        node.classList.toggle('hit',match);
        node.classList.toggle('dim',!!query&&!match);
      });
    }

    }

    function renderWatchlist() {
      const rows=state.watchlist.map(id=>companyById[id]).filter(Boolean);
      return `<section class="panel"><div class="company-header"><div><h1>Watchlist</h1><p class="muted">Saved locally in this browser.</p></div><span class="pill">${rows.length} saved</span></div>
        ${rows.length?rows.map(company=>`<div class="row"><div class="row-main">${companyLink(company.id)}<small>${escapeHtml(company.ticker)} · ${escapeHtml(company.industry)}</small></div><button type="button" class="button danger" data-toggle-watch="${company.id}">Remove</button></div>`).join(''):`<div class="empty"><strong>Your watchlist is empty</strong>Open a company profile and select “Add to watchlist”.</div>`}

    function mapProject(lon,lat) {
      const safeLat=Math.max(-60,Math.min(82,lat));
      return {x:(lon+180)/360*1200,y:(82-safeLat)/142*520};
    }
    function mapPath(points) {
      return points.map((point,index)=>{
        const xy=mapProject(point[0],point[1]);
        return `${index?'L':'M'}${xy.x.toFixed(1)},${xy.y.toFixed(1)}`;
      }).join(' ')+' Z';
    }
    function getVisibleMapEntities() {
      const query=state.mapSearch.trim().toLowerCase();
      const entities=[];
      if (state.mapShowHQ) {
        for (const company of COMPANIES) {
          const coords=HQ_COORDS[company.id];
          if (!coords) continue;
          if (state.mapCountry!=='all' && company.country!==state.mapCountry) continue;
          if (state.mapIndustry!=='all' && industryGroup(company)!==state.mapIndustry) continue;
          if (query && !`${company.name} ${company.ticker} ${company.hq} ${company.country} ${company.industry} ${coords[2]}`.toLowerCase().includes(query)) continue;
          entities.push({key:`hq:${company.id}`,kind:'hq',ownerId:company.id,name:`${company.name} HQ`,city:coords[2],country:company.country,lon:coords[0],lat:coords[1],group:industryGroup(company),company});
        }
      }
      if (state.mapShowFacilities) {
        for (const facility of FACILITIES) {
          const owner=companyById[facility.companyId];
          if (!owner) continue;
          if (state.mapCountry!=='all' && facility.country!==state.mapCountry) continue;
          if (state.mapIndustry!=='all' && industryGroup(owner)!==state.mapIndustry) continue;
          if (state.mapFacilityType!=='all' && facility.type!==state.mapFacilityType) continue;
          if (query && !`${facility.name} ${facility.city} ${facility.country} ${owner.name} ${owner.ticker} ${FACILITY_TYPE_LABEL[facility.type]}`.toLowerCase().includes(query)) continue;
          entities.push({key:`facility:${facility.id}`,kind:'facility',ownerId:facility.companyId,name:facility.name,city:facility.city,country:facility.country,lon:facility.lon,lat:facility.lat,group:industryGroup(owner),facility,company:owner});
        }
      }
      return entities.sort((a,b)=>a.country.localeCompare(b.country)||a.name.localeCompare(b.name));
    }
    function mapMarkerPositions(entities) {
      const result={},placed=[];
      for (const entity of entities) {
        const base=mapProject(entity.lon,entity.lat);
        let x=base.x,y=base.y,attempt=0;
        const crowded=()=>placed.some(point=>Math.hypot(point.x-x,point.y-y)<15);
        while (crowded() && attempt<70) {
          attempt++;
          const angle=attempt*2.399963229728653;
          const radius=10+Math.floor((attempt-1)/8)*6;
          x=Math.max(8,Math.min(1192,base.x+Math.cos(angle)*radius));
          y=Math.max(8,Math.min(512,base.y+Math.sin(angle)*radius));
        }
        result[entity.key]={x,y,baseX:base.x,baseY:base.y};
        placed.push({x,y});
      }
      return result;
    }
    function mapMarkerShape(entity,x,y,color) {

        <div class="map-kpis"><div class="map-kpi"><strong>${supplierCount}</strong><div class="muted">Known suppliers</div></div><div class="map-kpi"><strong>${customerCount}</strong><div class="muted">Known customers</div></div></div>

      </div>`:`<div class="map-selected"><strong>Select a map marker</strong><p class="muted">Choose a headquarters pin or a facility marker to see its location, company and evidence reference.</p></div>`;
      const listHtml=entities.map(entity=>`<button type="button" class="map-company-item ${entity.key===state.mapSelected?'active':''}" data-map-entity="${escapeHtml(entity.key)}">
        <span><strong>${escapeHtml(entity.name)}</strong><small>${escapeHtml(entity.company.name)} · ${escapeHtml(entity.city)}, ${escapeHtml(entity.country)}</small></span>
        <span class="map-swatch" style="background:${entity.kind==='hq'?'#e2e8f0':entity.facility.type==='fab'?'#22d3ee':entity.facility.type==='assembly-test'?'#a78bfa':entity.facility.type==='aircraft-assembly'?'#f5b942':'#4f8cff'}"></span>
      </button>`).join('') || '<div class="empty">No locations match these filters.</div>';
      const legend=[['Company HQ','#e2e8f0','hq'],['Semiconductor fab','#22d3ee','diamond'],['Manufacturing site','#4f8cff','square'],['Assembly & test','#a78bfa','triangle'],['Aircraft final assembly','#f5b942','bar']].map(([label,color,shape])=>`<span><i class="map-swatch ${shape}" style="background:${color}"></i>${label}</span>`).join('');

        <div class="map-kpis"><div class="map-kpi"><strong>${hqCount}</strong><div class="muted">Visible HQs</div></div><div class="map-kpi"><strong>${facilityCount}</strong><div class="muted">Visible facilities</div></div><div class="map-kpi"><strong>${countryCount}</strong><div class="muted">Countries</div></div></div>
        ${researchOverlayHtml()}
        <div class="map-layout">
          <div><div class="world-map-wrap"><svg id="world-map-svg" class="world-map" viewBox="${viewX} ${viewY} ${viewWidth} ${viewHeight}" role="img" aria-label="Illustrative world map with company headquarters and selected production facilities">
            <defs><marker id="map-arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#f5b942"/></marker><marker id="map-arrow-research" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#a78bfa"/></marker><linearGradient id="map-ocean" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1b2e"/><stop offset="1" stop-color="#07111e"/></linearGradient></defs>
            <rect x="0" y="0" width="1200" height="520" fill="url(#map-ocean)"/>${gridLon}${gridLat}${land}${mapLabels}${links}${markers}

          <aside class="map-sidebar">${selectionHtml}${researchOverlaySidebar()}<div class="map-selected"><div class="company-header"><strong>Locations in view</strong><span class="muted">${entities.length} results</span></div><div class="map-company-list">${listHtml}</div></div></aside>
